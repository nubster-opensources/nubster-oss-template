name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    if: ${{ github.repository != 'nubster-opensources/nubster-oss-template' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  identity-coherence:
    name: Identity coherence
    runs-on: ubuntu-latest
    if: ${{ github.repository != 'nubster-opensources/nubster-oss-template' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: bash scripts/check-identity-coherence.sh
        env:
          GH_TOKEN: ${{ github.token }}

  clippy:
    name: Clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    if: ${{ github.repository != 'nubster-opensources/nubster-oss-template' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    if: ${{ github.repository != 'nubster-opensources/nubster-oss-template' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
      - run: cargo test --workspace --all-features --no-fail-fast

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    if: ${{ github.repository != 'nubster-opensources/nubster-oss-template' }}
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: doc
      - run: cargo doc --workspace --all-features --no-deps

  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    if: ${{ github.repository != 'nubster-opensources/nubster-oss-template' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2.0.20
        with:
          command: check

  msrv-check:
    name: MSRV check (Rust 1.88)
    runs-on: ubuntu-latest
    if: ${{ github.repository != 'nubster-opensources/nubster-oss-template' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - run: cargo +1.88 check --workspace --all-features

  cargo-audit:
    name: Cargo audit
    runs-on: ubuntu-latest
    if: ${{ github.repository != 'nubster-opensources/nubster-oss-template' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: cargo-audit
      - run: cargo install --locked cargo-audit
      - run: cargo audit

  # TODO: add project-specific integration tests here.
  # Example:
  #   integration:
  #     name: Integration tests
  #     runs-on: ubuntu-latest
  #     steps:
  #       - uses: actions/checkout@v7
  #       - uses: dtolnay/rust-toolchain@1.88.0
  #       - run: cargo test -p <crate-name> --test <test-name> -- --nocapture
