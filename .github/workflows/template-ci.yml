name: Template CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  validate-template:
    name: Validate template generation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: template-ci

      - name: Install cargo-generate
        run: cargo install cargo-generate --locked

      - name: Generate probe project
        run: |
          mkdir -p "${{ runner.temp }}/gen"
          cargo generate \
            --path . \
            --name probe-svc \
            --define project-description="A probe service" \
            --destination ${{ runner.temp }}/gen \
            --silent

      - name: Check formatting in generated project
        working-directory: ${{ runner.temp }}/gen/probe-svc
        run: cargo fmt --all -- --check

      - name: Run Clippy in generated project
        working-directory: ${{ runner.temp }}/gen/probe-svc
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests in generated project
        working-directory: ${{ runner.temp }}/gen/probe-svc
        run: cargo test --all-features
